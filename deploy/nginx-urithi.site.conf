# Site nginx de www.urithi.site (installé dans /etc/nginx/sites-available/).
# Le certificat HTTPS est ajouté par certbot (--nginx).
server {
    listen 80;
    listen [::]:80;
    server_name urithi.site www.urithi.site;

    root /opt/urithi/app/web;
    index index.html;

    # Téléversements de médias (MAX_UPLOAD_MB=2048).
    client_max_body_size 2048m;

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # Fichiers versionnés par Vite : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /games/ {
        expires 30d;
        try_files $uri =404;
    }

    # Application monopage : toutes les autres adresses servent index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
}
